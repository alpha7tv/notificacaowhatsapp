<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rádio Player</title>
  <meta name="description" content="Player de web rádios em formato de aplicativo.">
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rádio">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4.5" height="14" rx="1.2"/><rect x="13.5" y="5" width="4.5" height="14" rx="1.2"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M7 6h2v12H7zM10.5 12l8.5 6V6z"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M15 6h2v12h-2zM5 18l8.5-6L5 6z"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20.3l-1.4-1.3C5.4 14.4 2 11.3 2 7.5 2 4.4 4.4 2 7.5 2c1.7 0 3.4.8 4.5 2.1C13.1 2.8 14.8 2 16.5 2 19.6 2 22 4.4 22 7.5c0 3.8-3.4 6.9-8.6 11.5L12 20.3z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><path d="M10.5 3a7.5 7.5 0 0 1 5.96 12.05l4.25 4.24-1.42 1.42-4.24-4.25A7.5 7.5 0 1 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M6.4 8.6L12 14.2l5.6-5.6L19 10l-7 7-7-7z"/></symbol>
    <symbol id="i-vol" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM15.5 8.5a5 5 0 0 1 0 7l-1.4-1.4a3 3 0 0 0 0-4.2zM18.3 5.7a9 9 0 0 1 0 12.6l-1.4-1.4a7 7 0 0 0 0-9.8z"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM16 9.4l1.4-1.4 2.1 2.1 2.1-2.1L23 9.4l-2.1 2.1 2.1 2.1-1.4 1.4-2.1-2.1-2.1 2.1-1.4-1.4 2.1-2.1z"/></symbol>
    <symbol id="i-timer" viewBox="0 0 24 24"><path d="M9 1h6v2H9zM12 5a8 8 0 1 1 0 16 8 8 0 0 1 0-16zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12zm-1 2h2v4.6l3 1.8-1 1.7-4-2.4z"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M12 2l5 5-1.4 1.4L13 5.8V15h-2V5.8L8.4 8.4 7 7zM5 11h3v2H6v7h12v-7h-2v-2h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-9a1 1 0 0 1 1-1z"/></symbol>
    <symbol id="i-radio" viewBox="0 0 24 24"><path d="M4 8h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2zm3.5 3.5a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM14 12v1.5h5V12zm0 3v1.5h5V15zM16.6 2.4l.8 1.8L7.9 8H5.3z"/></symbol>
  </svg>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <img src="icons/icon.svg" alt="" width="32" height="32">
        <h1 id="appTitle">Rádio Player</h1>
      </div>
      <button class="icon-btn" id="installBtn" hidden aria-label="Instalar aplicativo">Instalar</button>
    </header>

    <div class="search">
      <svg><use href="#i-search"/></svg>
      <input id="search" type="search" placeholder="Buscar rádio, cidade ou gênero" autocomplete="off" aria-label="Buscar rádio">
    </div>

    <nav class="tabs" role="tablist">
      <button role="tab" class="tab active" data-tab="all" aria-selected="true">Todas</button>
      <button role="tab" class="tab" data-tab="fav" aria-selected="false">Favoritas</button>
      <button role="tab" class="tab" data-tab="recent" aria-selected="false">Recentes</button>
    </nav>

    <div class="genres" id="genres" aria-label="Gêneros"></div>

    <main class="list" id="list" aria-live="polite"></main>
  </div>

  <!-- Mini player fixo no rodapé -->
  <div class="mini" id="mini" hidden>
    <button class="mini-open" id="miniOpen" aria-label="Abrir player">
      <img class="cover sm" id="miniCover" alt="">
      <span class="mini-text">
        <strong id="miniName"></strong>
        <small id="miniNow"></small>
      </span>
    </button>
    <button class="play sm" id="miniPlay" aria-label="Tocar"><svg><use href="#i-play"/></svg></button>
  </div>

  <!-- Tela "tocando agora" -->
  <section class="player" id="player" aria-hidden="true" aria-label="Tocando agora">
    <div class="player-bg" id="playerBg"></div>
    <div class="player-inner">
      <div class="player-top">
        <button class="icon-btn" id="closePlayer" aria-label="Fechar player"><svg><use href="#i-down"/></svg></button>
        <span class="status" id="status">Parado</span>
        <button class="icon-btn" id="shareBtn" aria-label="Compartilhar"><svg><use href="#i-share"/></svg></button>
      </div>

      <div class="art-wrap">
        <img class="cover lg" id="cover" alt="">
        <div class="eq" id="eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      </div>

      <div class="meta">
        <div class="meta-text">
          <h2 id="stationName">—</h2>
          <p id="nowPlaying">Escolha uma rádio</p>
        </div>
        <button class="icon-btn fav-btn" id="favBtn" aria-label="Favoritar" aria-pressed="false"><svg><use href="#i-heart"/></svg></button>
      </div>

      <div class="controls">
        <button class="icon-btn lg" id="prevBtn" aria-label="Rádio anterior"><svg><use href="#i-prev"/></svg></button>
        <button class="play lg" id="playBtn" aria-label="Tocar"><svg><use href="#i-play"/></svg></button>
        <button class="icon-btn lg" id="nextBtn" aria-label="Próxima rádio"><svg><use href="#i-next"/></svg></button>
      </div>

      <div class="volume">
        <button class="icon-btn" id="muteBtn" aria-label="Silenciar"><svg><use href="#i-vol"/></svg></button>
        <input type="range" id="volume" min="0" max="1" step="0.01" value="1" aria-label="Volume">
      </div>

      <div class="extras">
        <button class="chip" id="timerBtn"><svg><use href="#i-timer"/></svg><span id="timerLabel">Desligar em…</span></button>
      </div>
    </div>
  </section>

  <dialog id="timerDialog">
    <form method="dialog">
      <h3>Desligar automaticamente</h3>
      <div class="timer-options">
        <button value="15">15 min</button>
        <button value="30">30 min</button>
        <button value="45">45 min</button>
        <button value="60">1 hora</button>
        <button value="90">1h30</button>
        <button value="0">Desativar</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status"></div>

  <audio id="audio" preload="none"></audio>
  <script src="js/app.js" defer></script>
</body>
</html>
