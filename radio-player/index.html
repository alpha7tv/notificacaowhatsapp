<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rádio Player</title>
  <meta name="description" content="Player de web rádios em formato de aplicativo.">
  <meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">

  <link rel="apple-touch-icon" id="touchIcon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css?v=__BUILD__">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>
<body>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <img src="icons/icon.svg" id="appLogo" alt="" width="36" height="36">
        <h1 id="appTitle">Rádio Player</h1>
      </div>
      <button class="install-btn" id="installBtn" hidden><svg><use href="#i-install"/></svg>Instalar app</button>
    </header>

    <div class="modes" id="modes" role="tablist" hidden>
      <button role="tab" class="mode" data-mode="radio" aria-selected="true"><svg><use href="#i-radio"/></svg>Rádios</button>
      <button role="tab" class="mode" data-mode="tv" aria-selected="false"><svg><use href="#i-tv"/></svg>TV ao vivo</button>
    </div>

    <div class="search">
      <svg><use href="#i-search"/></svg>
      <input id="search" type="search" placeholder="Buscar rádio, cidade ou gênero" autocomplete="off" aria-label="Buscar rádio">
    </div>

    <nav class="tabs" role="tablist">
      <button role="tab" class="tab active" data-tab="all" aria-selected="true">Todas</button>
      <button role="tab" class="tab" data-tab="fav" aria-selected="false">Favoritas</button>
      <button role="tab" class="tab" data-tab="recent" aria-selected="false">Recentes</button>
    </nav>

    <div class="genres" id="genres" aria-label="Estilos"></div>

    <aside class="ad-slot ad-top" id="adTop" aria-label="Publicidade" hidden></aside>

    <main class="list" id="list" aria-live="polite"></main>

    <footer class="about" id="about" hidden>
      <p id="aboutText"></p>
      <div class="contacts" id="contacts"></div>
    </footer>
  </div>

  <!-- Mini player fixo no rodapé -->
  <div class="mini" id="mini" hidden>
    <button class="mini-open" id="miniOpen" aria-label="Abrir player">
      <img class="cover sm" id="miniCover" alt="">
      <span class="mini-text">
        <strong id="miniName"></strong>
        <small id="miniNow"></small>
      </span>
    </button>
    <button class="play sm" id="miniPlay" aria-label="Tocar"><svg><use href="#i-play"/></svg></button>
  </div>

  <!-- Tela "tocando agora" -->
  <section class="player" id="player" aria-hidden="true" aria-label="Tocando agora">
    <div class="player-bg" id="playerBg"></div>
    <div class="player-inner">
      <div class="player-top">
        <button class="icon-btn glass" id="closePlayer" aria-label="Fechar player"><svg><use href="#i-down"/></svg></button>
        <span class="status" id="status">Parado</span>
        <button class="icon-btn glass fav-btn" id="favBtn" aria-label="Favoritar" aria-pressed="false"><svg><use href="#i-heart"/></svg></button>
      </div>

      <div class="art-wrap">
        <div class="art">
          <span class="art-ring" aria-hidden="true"></span>
          <img class="cover lg" id="cover" alt="">
        </div>
      </div>

      <div class="meta">
        <h2 id="stationName">—</h2>
        <p id="nowPlaying">Escolha uma rádio</p>
      </div>

      <div class="bars" id="eq" aria-hidden="true"></div>

      <div class="volume">
        <button class="icon-btn" id="muteBtn" aria-label="Silenciar"><svg><use href="#i-vol"/></svg></button>
        <input type="range" id="volume" min="0" max="1" step="0.01" value="1" aria-label="Volume">
      </div>

      <div class="controls">
        <button class="icon-btn side" id="timerBtn" aria-label="Desligar automaticamente"><svg><use href="#i-timer"/></svg><small id="timerLabel"></small></button>
        <button class="icon-btn lg" id="prevBtn" aria-label="Rádio anterior"><svg><use href="#i-prev"/></svg></button>
        <button class="play lg" id="playBtn" aria-label="Tocar"><svg><use href="#i-play"/></svg></button>
        <button class="icon-btn lg" id="nextBtn" aria-label="Próxima rádio"><svg><use href="#i-next"/></svg></button>
        <button class="icon-btn side" id="shareBtn" aria-label="Compartilhar"><svg><use href="#i-share"/></svg></button>
      </div>

      <div class="player-social" id="playerSocial" hidden></div>

      <aside class="ad-slot ad-player" id="adPlayer" aria-label="Publicidade" hidden></aside>
    </div>
  </section>

  <!-- Tela da TV -->
  <section class="tvscreen" id="tvScreen" aria-hidden="true" aria-label="TV ao vivo">
    <div class="tv-inner">
      <div class="player-top">
        <button class="icon-btn glass" id="closeTv" aria-label="Fechar TV"><svg><use href="#i-down"/></svg></button>
        <span class="status live">Ao vivo</span>
        <button class="icon-btn glass" id="shareTv" aria-label="Compartilhar canal"><svg><use href="#i-share"/></svg></button>
      </div>
      <div class="tv-frame" id="tvFrame"></div>
      <div class="tv-info">
        <div class="tv-text">
          <h2 id="tvName"></h2>
          <p id="tvDesc"></p>
        </div>
        <button class="icon-btn glass fav-btn" id="tvFav" aria-label="Favoritar canal" aria-pressed="false"><svg><use href="#i-heart"/></svg></button>
      </div>
      <aside class="ad-slot ad-player" id="adTv" aria-label="Publicidade" hidden></aside>
      <div class="tv-more-wrap" id="tvMoreWrap" hidden>
        <h3>Outros canais</h3>
        <div class="tv-more" id="tvMore"></div>
      </div>
    </div>
  </section>

  <dialog id="timerDialog">
    <form method="dialog">
      <h3>Desligar automaticamente</h3>
      <div class="timer-options">
        <button value="15">15 min</button>
        <button value="30">30 min</button>
        <button value="45">45 min</button>
        <button value="60">1 hora</button>
        <button value="90">1h30</button>
        <button value="0">Desativar</button>
      </div>
    </form>
  </dialog>

  <dialog id="adPopup" class="ad-popup" aria-label="Publicidade">
    <button class="popup-close" id="adPopupClose" aria-label="Fechar publicidade"><svg><use href="#i-close"/></svg></button>
    <div id="adPopupBody"></div>
    <small class="ad-label">Publicidade</small>
  </dialog>

  <dialog id="installDialog">
    <h3>Instalar o aplicativo</h3>
    <div id="installSteps"></div>
    <p class="install-note">Você também pode continuar ouvindo direto pelo navegador, sem instalar.</p>
    <form method="dialog"><button class="btn-primary">Entendi</button></form>
  </dialog>

  <div class="toast" id="toast" role="status"></div>

  <audio id="audio" preload="none"></audio>
  <script src="js/app.js?v=__BUILD__" defer></script>
</body>
</html>
